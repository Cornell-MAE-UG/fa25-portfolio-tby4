---
layout: default
---

<article class="project">

  <a href="{{ "/projects/" | relative_url }}" class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
  </a>

  <header class="project-header">
    {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.imagealt | default: page.title }}" class="project-hero" />
    {% endif %}

    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="project-description">{{ page.description }}</p>
    {% endif %}

    {% if page.technologies %}
      <div class="project-tech">
        <span class="tech-label">Technologies</span>
        <span>{{ page.technologies | join: ", " }}</span>
      </div>
    {% endif %}
  </header>

  <div class="project-content">
    {{ content }}
  </div>

  <a href="{{ "/projects/" | relative_url }}" class="back-arrow back-arrow-bottom">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
  </a>

</article>
